<!DOCTYPE html>
<html lang="en">
<! ––This is a sample code for Hello World in Front-End Developer to show and understand how it works––>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hello World</title>
    </head>

    <body>
        <h1 id="message">Loading...</h1>
        <script>
            // Fetch the "Hello, World!" message from the server
            fetch('http://localhost:5500') // Corrected port number
                .then(response => response.text())
                .then(data => {
                    document.getElementById('message').textContent = data;
                })
                .catch(err => console.error(err));
        </script>
    </body>

</html>
